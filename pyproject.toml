[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clarify-ai-mcp"
version = "0.4.0"
description = "Enterprise-grade, local-first AI image super-resolution and enhancement via ONNX Runtime & OpenCV — pluggable model registry (SPAN / SRVGG Compact / RealPLSKR), MCP server, sub-50 MB, zero PyTorch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Soumik Kar", email = "your_email@domain.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
]
dependencies = [
    "numpy>=1.22.0",
    "opencv-python-headless>=4.7.0",
    "onnxruntime>=1.15.0",
    "Pillow>=9.5.0",
]

[project.optional-dependencies]
# Optional GPU acceleration for systems with NVIDIA drivers installed
gpu = ["onnxruntime-gpu>=1.15.0"]
# Model Context Protocol (MCP) server for local image upscaling via Claude Desktop / Cursor / agents
mcp = ["mcp>=1.0.0,<2"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "mypy>=1.8.0", "ruff>=0.8.0", "build>=1.0.0", "twine>=4.0.0"]

[project.scripts]
clarify-mcp = "clarify.cli:main"
clarify-mcp-server = "clarify.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clarify"]

[tool.ruff]
line-length = 100
ignore = ["UP007", "UP045"]

[tool.hatch.build.targets.wheel.shared-data]
"src/clarify/models" = "clarify/models"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "README.md",
    "pyproject.toml",
    "LICENSE",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
